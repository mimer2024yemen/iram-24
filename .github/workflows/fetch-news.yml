name: fetch-news

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub minimum)
  workflow_dispatch: {}      # allow manual trigger from admin panel

concurrency:
  group: fetch-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: scripts/fetch-news
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Run pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/fetch-news/fetch.mjs

      - name: Commit updated data
        run: |
          git config user.name "iram24-news-bot"
          git config user.email "bot@iram24.local"
          git add data
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "news: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
