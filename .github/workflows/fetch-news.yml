name: fetch-news

# Free, always-on news fetcher (public repo => unlimited Actions minutes).
# One run loops for ~5.5 hours, fetching every 3 minutes, then re-starts itself.
# The schedule below is only a safety net in case the chain ever breaks.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: fetch-news
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: scripts/fetch-news
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Fetch loop
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          git config user.name "iram24-news-bot"
          git config user.email "bot@iram24.local"
          end=$((SECONDS + 330 * 60))
          while [ $SECONDS -lt $end ]; do
            git pull --rebase --autostash -q || git rebase --abort || true
            node scripts/fetch-news/fetch.mjs || echo "::warning::fetch run failed, retrying next cycle"
            git add data
            if ! git diff --staged --quiet; then
              git commit -q -m "news: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              for i in 1 2 3; do
                git pull --rebase -q && git push -q && break
                git rebase --abort 2>/dev/null || true
                sleep 5
              done
            fi
            sleep 180
          done

      - name: Restart the loop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fetch-news.yml --ref "${{ github.ref_name }}" || echo "restart request failed; schedule will resume"
