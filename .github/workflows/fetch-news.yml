name: fetch-news

# Free, always-on news fetcher (public repo => unlimited Actions minutes).
# Runs once every 60 minutes, plus a manual Run workflow button. Never commits to main.
#
# News JSON is written to the separate "data" branch, never to main, so the
# Lovable <-> GitHub code sync can not diverge. New articles are also copied
# into the site's database when SUPABASE_SERVICE_ROLE_KEY is set.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: fetch-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: scripts/fetch-news
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Fetch news once
        env:
          SUPABASE_URL: https://nfcugikphoqymcqtotnv.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRAM24 }}
          DATA_BRANCH: data
        run: |
          git config user.name "iram24-news-bot"
          git config user.email "bot@iram24.local"
          node scripts/fetch-news/fetch.mjs
